name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.6.9

      - name: Guard against committed microdata
        run: python scripts/check_no_microdata.py

      - name: Validate source metadata
        run: python scripts/validate_metadata.py

      - name: Lint scripts
        run: ruff check scripts

      - name: Build source matrix workbook
        run: python scripts/build_source_matrix.py --out "$RUNNER_TEMP/source_matrix.xlsx"
